        // 解析比赛竞猜文本（静态版本：名字和比分分开）
        window.parseMatchGuessText = function() {
            const text = document.getElementById('matchGuessTextInput').value.trim();
            if (!text) { showToast('请先输入或粘贴竞猜内容', 'error'); return; }
            const lines = text.split('\n').filter(l => l.trim());
            const maxTb = 6;

            // 先清空所有行
            for (let i = 1; i <= maxTb; i++) {
                const gaName = document.getElementById('gaName' + i);
                const gaScore = document.getElementById('gaScore' + i);
                const gbName = document.getElementById('gbName' + i);
                const gbScore = document.getElementById('gbScore' + i);
                const gaPs = document.getElementById('gaPs' + i);
                const gbPs = document.getElementById('gbPs' + i);
                if (gaName) gaName.value = '';
                if (gaScore) gaScore.value = '';
                if (gbName) gbName.value = '';
                if (gbScore) gbScore.value = '';
                if (gaPs) gaPs.value = '';
                if (gbPs) gbPs.value = '';
            }

            let parsedCount = 0;
            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim();
                // 只识别TB开头的行
                const tbMatch = line.match(/^\s*TB\s*(\d+)\s*[:：\s]?/i);
                if (!tbMatch) continue;
                const tbIndex = parseInt(tbMatch[1]);
                line = line.substring(tbMatch[0].length).trim();
                // 去掉冒号及之前的内容
                const colonIdx = line.search(/[:：]/);
                if (colonIdx >= 0) line = line.substring(colonIdx + 1).trim();

                if (tbIndex > maxTb) {
                    showToast(`内容中包含 TB${tbIndex}，但最多支持 TB${maxTb}，已忽略`, 'warning');
                    continue;
                }

                let sideA = '', sideB = '';
                if (line.includes(' vs ')) { const p = line.split(' vs '); sideA = p[0].trim(); sideB = p[1].trim(); }
                else if (line.includes(' VS ')) { const p = line.split(' VS '); sideA = p[0].trim(); sideB = p[1].trim(); }
                else if (line.includes('|')) { const p = line.split('|'); sideA = p[0].trim(); sideB = p[1].trim(); }
                else { sideA = line; }
                const aParts = extractNameAndScore(sideA);
                const bParts = extractNameAndScore(sideB);
                if (aParts.name) document.getElementById('gaName' + tbIndex).value = aParts.name;
                if (aParts.score) document.getElementById('gaScore' + tbIndex).value = aParts.score;
                if (bParts.name) document.getElementById('gbName' + tbIndex).value = bParts.name;
                if (bParts.score) document.getElementById('gbScore' + tbIndex).value = bParts.score;
                if (aParts.name || bParts.name) parsedCount++;
            }
            window.adminCalcTotals();
            showToast(parsedCount > 0 ? `成功解析 ${parsedCount} 个TB的竞猜内容` : '未能解析到有效内容，请检查格式', parsedCount > 0 ? 'success' : 'error');
        };

        function extractNameAndScore(str) {
            if (!str) return { name: '', score: '', wins: 0 };
            const setPattern = /(\d)\s*[-–]\s*(\d)/g;
            let wins = 0, match, scoreParts = [];
            while ((match = setPattern.exec(str)) !== null) {
                const s1 = parseInt(match[1]), s2 = parseInt(match[2]);
                scoreParts.push(match[1] + '-' + match[2]);
                if (s1 > s2) wins++;
            }
            let name = str;
            if (scoreParts.length > 0) {
                const firstScoreIdx = str.search(/\d\s*[-–]\s*\d/);
                if (firstScoreIdx > 0) name = str.substring(0, firstScoreIdx).trim();
            }
            return { name: name, score: scoreParts.join(' '), wins: wins };
        }

        // 分开解析两个球员的竞猜内容
        window.parseMatchGuessTextSeparate = function() {
            const textA = document.getElementById('matchGuessTextInputA').value.trim();
            const textB = document.getElementById('matchGuessTextInputB').value.trim();
            if (!textA && !textB) { showToast('请先输入竞猜内容', 'error'); return; }

            const p1Name = document.getElementById('matchupP1').textContent.trim();
            const p2Name = document.getElementById('matchupP2').textContent.trim();
            const linesA = textA.split('\n').filter(l => l.trim());
            const linesB = textB.split('\n').filter(l => l.trim());
            const maxTb = 6;
            let parsedCount = 0;

            // 只清空有输入的那一侧，另一侧保留
            if (textA) {
                for (let i = 1; i <= maxTb; i++) {
                    document.getElementById('gaPred' + i).value = '';
                    document.getElementById('gaPs' + i).value = '';
                }
            }
            if (textB) {
                for (let i = 1; i <= maxTb; i++) {
                    document.getElementById('gbPred' + i).value = '';
                    document.getElementById('gbPs' + i).value = '';
                }
            }

            // 解析A侧，只识别TB开头
            for (let i = 0; i < linesA.length; i++) {
                let line = linesA[i].trim();
                const tbMatch = line.match(/^\s*TB\s*(\d+)\s*[:：\s]?/i);
                if (!tbMatch) continue;
                const tbIndex = parseInt(tbMatch[1]);
                if (tbIndex > maxTb) continue;
                line = line.substring(tbMatch[0].length).trim();
                // 如果只填了比分，自动补球员名
                if (line && !line.match(/[^\d\s\-–\/]/) && p1Name && p1Name !== '球员1') {
                    line = p1Name + ' ' + line;
                }
                if (line) {
                    document.getElementById('gaPred' + tbIndex).value = line;
                }
            }

            // 解析B侧，只识别TB开头
            for (let i = 0; i < linesB.length; i++) {
                let line = linesB[i].trim();
                const tbMatch = line.match(/^\s*TB\s*(\d+)\s*[:：\s]?/i);
                if (!tbMatch) continue;
                const tbIndex = parseInt(tbMatch[1]);
                if (tbIndex > maxTb) continue;
                line = line.substring(tbMatch[0].length).trim();
                // 如果只填了比分，自动补球员名
                if (line && !line.match(/[^\d\s\-–\/]/) && p2Name && p2Name !== '球员2') {
                    line = p2Name + ' ' + line;
                }
                if (line) {
                    document.getElementById('gbPred' + tbIndex).value = line;
                }
            }

            // 统计解析到的行数
            for (let i = 1; i <= maxTb; i++) {
                if (document.getElementById('gaPred' + i).value || document.getElementById('gbPred' + i).value) {
                    parsedCount++;
                }
            }

            window.adminCalcTotals();
            if (parsedCount > 0) {
                // 解析成功后清空文本框，避免下次解析时误判两侧都有内容
                document.getElementById('matchGuessTextInputA').value = '';
                document.getElementById('matchGuessTextInputB').value = '';
                showToast(`成功解析 ${parsedCount} 个TB的竞猜内容`, 'success');
            } else {
                showToast('未能解析到有效内容', 'error');
            }
        };

        function calcSetScoreStatic(prediction) {
            if (!prediction) return 0;
            const setPattern = /(\d)\s*[-–]\s*(\d)/g;
            let wins = 0, match;
            while ((match = setPattern.exec(prediction)) !== null) {
                if (parseInt(match[1]) > parseInt(match[2])) wins++;
            }
            return wins;
        }

        window.adminSaveMatch = async function(e) {
            e.preventDefault();
            try {
                const id = document.getElementById('mId').value;
                const tid = document.getElementById('matchTournamentSelect').value;
                if (!tid) { showToast('请先选择赛事', 'error'); return; }
                const status = document.getElementById('mStatus').value;
                const p1Id = document.getElementById('mPlayer1').value ? parseInt(document.getElementById('mPlayer1').value) : null;
                const p2Id = document.getElementById('mPlayer2').value ? parseInt(document.getElementById('mPlayer2').value) : null;
                const aPreds = [1, 2, 3, 4, 5, 6].map(i => document.getElementById('gaPred' + i).value.trim());
                const bPreds = [1, 2, 3, 4, 5, 6].map(i => document.getElementById('gbPred' + i).value.trim());
                const aScores = [1, 2, 3, 4, 5, 6].map(i => (document.getElementById('gaPs' + i).value || '').trim());
                const bScores = [1, 2, 3, 4, 5, 6].map(i => (document.getElementById('gbPs' + i).value || '').trim());
                const aTotal = aScores.reduce((s, v) => s + (parseInt(v) || 0), 0);
                const bTotal = bScores.reduce((s, v) => s + (parseInt(v) || 0), 0);
                const guessWinner = document.getElementById('mGuessWinner').value;
                const guessReason = document.getElementById('mGuessReason').value.trim();

                // 只有状态为 completed 时才结算胜负
                let winnerId = null;
                if (status === 'completed') {
                    if (guessWinner === 'player1' && p1Id) winnerId = p1Id;
                    else if (guessWinner === 'player2' && p2Id) winnerId = p2Id;
                    else if (aTotal > bTotal && p1Id) winnerId = p1Id;
                    else if (bTotal > aTotal && p2Id) winnerId = p2Id;
                }

                // 直接用预测内容（球员名+比分合并的格式），用逗号分隔6个TB
                const aTbCombined = aPreds.join(',');
                const bTbCombined = bPreds.join(',');
                const matchOrder = parseInt(document.getElementById('mOrder').value);
                const data = {
                    tournament_id: parseInt(tid),
                    round: document.getElementById('mRound').value,
                    match_order: isNaN(matchOrder) ? 1 : matchOrder,
                    player1_id: p1Id,
                    player2_id: p2Id,

                    guess_b_tb: bTbCombined,
                    guess_a_total: aTotal,
                    guess_b_total: bTotal,
                    guess_a_tb_score: aScores.join(','),
                    guess_b_tb_score: bScores.join(','),
                    guess_winner: guessWinner,
                    guess_reason: guessReason,
                };

                let result;
                if (id) {
                    result = await updateMatch(parseInt(id), data);
                } else {
                    result = await createMatch(data);
                }
                if (result.success) {
                    closeModal('matchModal');
                    const msg = id ? (status === 'completed' ? '比赛已更新，胜者已自动晋级到下一轮' : '比赛已更新') : '比赛已添加';

                    showToast('操作失败: ' + (result.error || '未知错误'), 'error');

                console.error('保存比赛出错:', err);
                showToast('保存失败: ' + (err.message || '未知错误'), 'error');
            }
        };

            await autoAdvanceByes(parseInt(tid), rounds);
            showToast('轮空晋级处理完成', 'success');
            adminLoadMatchList();
        };

        // ── Daily Guess Management ──
        window.adminLoadGuessSelect = async function() {
            const data = await getTournaments();
            const select = document.getElementById('guessTournamentSelect');
            select.innerHTML = '<option value="">请选择赛事</option>' + (Array.isArray(data) ? data.map(t => '<option value="' + t.id + '">' + escapeHtml(t.name_cn || t.name) + '</option>').join('') : '');
            const activeId = findActiveTournamentId(data);
            if (activeId && !select.value) {
                select.value = activeId;
                adminLoadDailyGuessList();
            }
        }

        window.adminLoadDailyGuessList = async function() {
            const tid = document.getElementById('guessTournamentSelect').value;
            const tbody = document.getElementById('dailyGuessTable');
            if (!tid) { tbody.innerHTML = '<tr><td colspan="16" class="text-center" style="padding:40px;">请先选择赛事</td></tr>'; return; }
            const data = await getDailyGuesses(parseInt(tid));
            if (!Array.isArray(data) || data.length === 0) { tbody.innerHTML = '<tr><td colspan="16" class="text-center" style="padding:40px;">暂无竞猜数据</td></tr>'; return; }
            tbody.innerHTML = data.map(g => '<tr style="cursor:pointer;" onclick="adminEditGuess(' + g.id + ')"><td class="hide-mobile">' + g.id + '</td><td>' + (g.guess_date || '') + '</td><td class="hide-mobile">' + (g.deadline ? escapeHtml(g.deadline.replace('T', ' ')) : '-') + '</td><td>' + escapeHtml(g.tb1_match || '') + '</td><td class="hide-mobile">' + escapeHtml(g.tb1_result || '') + '</td><td>' + escapeHtml(g.tb2_match || '') + '</td><td class="hide-mobile">' + escapeHtml(g.tb2_result || '') + '</td><td class="hide-mobile">' + escapeHtml(g.tb3_match || '') + '</td><td class="hide-mobile">' + escapeHtml(g.tb3_result || '') + '</td><td class="hide-mobile">' + escapeHtml(g.tb4_match || '') + '</td><td class="hide-mobile">' + escapeHtml(g.tb4_result || '') + '</td><td class="hide-mobile">' + escapeHtml(g.tb5_match || '') + '</td><td class="hide-mobile">' + escapeHtml(g.tb5_result || '') + '</td><td class="hide-mobile">' + escapeHtml(g.tb6_match || '') + '</td><td class="hide-mobile">' + escapeHtml(g.tb6_result || '') + '</td><td><button class="btn btn-danger btn-sm" onclick="event.stopPropagation(); adminDeleteGuess(' + g.id + ')">删除</button></td></tr>').join('');
        };

        window.adminParseGuessMatches = function() {
            const text = document.getElementById('gBulkMatches').value || '';
            const allLines = text.split('\n').map(l => l.trim()).filter(l => l);
            const currentYear = new Date().getFullYear();

            // 从字符串中提取日期，支持多种格式：
            // 8.2 / 8-2 / 8/2 / 8月2 / 8月2日 / 8月2号 / 08-02 / 2026.8.2 / 2026-08-02
            function extractDate(str) {
                // 先尝试带年份的格式 2026.8.2 / 2026-08-02
                let m = str.match(/(\d{4})[.\-\/](\d{1,2})[.\-\/](\d{1,2})/);
                if (m) {
                    return m[1] + '-' + String(m[2]).padStart(2, '0') + '-' + String(m[3]).padStart(2, '0');
                }
                // 不带年份的格式 8.2 / 8-2 / 8/2 / 8月2(日/号)
                m = str.match(/(\d{1,2})[.\-\/月](\d{1,2})/);
                if (m) {
                    return currentYear + '-' + String(m[1]).padStart(2, '0') + '-' + String(m[2]).padStart(2, '0');
                }
                return null;
            }

            // 从字符串中提取时间 HH:MM
            function extractTime(str) {
                const m = str.match(/(\d{1,2})[：:](\d{2})/);
                if (m) {
                    return String(m[1]).padStart(2, '0') + ':' + m[2];
                }
                return null;
            }

            let parsedDate = null;
            let parsedDeadline = null;

            for (const line of allLines) {
                const lower = line.toLowerCase();

                // 1. 尝试解析截止时间（包含"截止"或"deadline"的行）
                if (!parsedDeadline && /截止|deadline/i.test(line)) {
                    const d = extractDate(line);
                    const t = extractTime(line);
                    if (d && t) {
                        parsedDeadline = d + 'T' + t;
                        parsedDate = d;
                        continue;
                    }
                }

                // 2. 尝试解析日期（包含"日期"的行）
                if (!parsedDate && /日期|竞猜日期|date/i.test(line)) {
                    const d = extractDate(line);
                    if (d) { parsedDate = d; continue; }
                }

                // 3. 尝试解析纯日期行（整行就是日期，如 "8.2" / "8月2日" / "8月2号"）
                if (!parsedDate) {
                    const d = extractDate(line);
                    // 确保这行只是一个日期，没有其他内容（允许 日/号 后缀）
                    if (d && /^[^\d]*(\d{1,2})[.\-\/月](\d{1,2})[日号]?$/.test(line.trim())) {
                        parsedDate = d;
                        continue;
                    }
                }
            }

            if (parsedDate) {
                document.getElementById('gDate').value = parsedDate;
            }
            if (parsedDeadline) {
                document.getElementById('gDeadline').value = parsedDeadline;
            }

            // 用 vs 匹配对阵行（大小写不敏感），并识别 TB 编号前缀
            const matchLines = [];
            for (const line of allLines) {
                if (!/\bvs\b/i.test(line)) continue;
                // 识别 TB 编号前缀（如 "TB5:"、"TB7 "、"tb3："）
                const tbMatch = line.match(/^\s*TB\s*(\d+)\s*[:：\s]?/i);
                let tbNum = null;
                let cleanLine = line;
                if (tbMatch) {
                    tbNum = parseInt(tbMatch[1]);
                    cleanLine = line.substring(tbMatch[0].length).trim();
                }
                matchLines.push({ tbNum, line: cleanLine, raw: line });
            }
            if (matchLines.length === 0 && !parsedDate && !parsedDeadline) {
                showToast('未识别到有效的内容', 'error'); return;
            }

            // 先清空所有行
            const maxTb = 6;
            for (let i = 1; i <= maxTb; i++) {
                const f = document.getElementById('gTb' + i + 'Match');
                if (f) f.value = '';
                const w = document.getElementById('gTb' + i + 'Winner');
                if (w) w.value = '';
                const s = document.getElementById('gTb' + i + 'Score');
                if (s) s.value = '';
            }

            let filled = 0;
            let autoIdx = 0;
            for (const item of matchLines) {
                let line = item.line;
                // 去掉冒号及之前的内容
                const colonIdx = line.search(/[:：]/);
                if (colonIdx >= 0) line = line.substring(colonIdx + 1).trim();
                // 大小写不敏感，不要求两侧必须有空格
                const parts = line.split(/\s*vs\s*/i);
                if (parts.length >= 2) {
                    const p1 = parts[0].trim();
                    const p2 = parts.slice(1).join(' vs ').trim();
                    // 确定行号：有 TB 编号用编号，否则按顺序
                    let rowNum;
                    if (item.tbNum !== null) {
                        rowNum = item.tbNum;
                    } else {
                        autoIdx++;
                        rowNum = autoIdx;
                    }
                    if (rowNum > maxTb) {
                        showToast(`内容中包含 TB${rowNum}，但数据库最多支持 TB${maxTb}，已忽略`, 'warning');
                        continue;
                    }
                    const matchField = document.getElementById('gTb' + rowNum + 'Match');
                    if (matchField) { matchField.value = p1 + ' vs ' + p2; filled++; }
                }
            }
            const msgs = [];
            if (parsedDate) msgs.push('日期 ' + parsedDate);
            if (parsedDeadline) msgs.push('截止 ' + parsedDeadline.replace('T', ' '));
            if (filled > 0) msgs.push(filled + ' 条对阵');
            if (msgs.length === 0) {
                showToast('未能解析到有效内容，请检查格式（每行一场对阵，用 vs 分隔）', 'error');
            } else {
                showToast('已填充: ' + msgs.join('，'), 'success');
            }
        };

        window.adminOpenGuessModal = function(guessData) {
            document.getElementById('guessForm').reset();
            document.getElementById('gId').value = '';
            if (guessData) {
                document.getElementById('gId').value = guessData.id;
                document.getElementById('gDate').value = guessData.guess_date || '';
                document.getElementById('gDeadline').value = guessData.deadline || '';
                for (let i = 1; i <= 6; i++) {
                    document.getElementById('gTb' + i + 'Match').value = guessData['tb' + i + '_match'] || '';
                    var resultStr = guessData['tb' + i + '_result'] || '';
                    var winner = '';
                    var score = '';
                    if (resultStr) {
                        var parts = resultStr.split(' ');
                        if (parts.length >= 2) {
                            score = parts[parts.length - 1];
                            if (/^\d/.test(score)) {
                                winner = parts.slice(0, -1).join(' ');
                            } else {
                                winner = resultStr;
                                score = '';
                            }
                        } else {
                            winner = resultStr;
                        }
                    }
                    var wEl = document.getElementById('gTb' + i + 'Winner');
                    var sEl = document.getElementById('gTb' + i + 'Score');
                    if (wEl) wEl.value = winner;
                    if (sEl) sEl.value = score;
                }
                document.getElementById('guessModalTitle').textContent = '编辑竞猜';
            } else {
                document.getElementById('guessModalTitle').textContent = '新增竞猜';
            }
            openModal('guessModal');
        };

        window.adminSaveGuess = async function(e) {
            e.preventDefault();
            const id = document.getElementById('gId').value;
            const tid = document.getElementById('guessTournamentSelect').value;
            if (!tid) { showToast('请先选择赛事', 'error'); return; }
            const data = {
                guess_date: document.getElementById('gDate').value,
                deadline: document.getElementById('gDeadline').value,
            };
            for (let i = 1; i <= 6; i++) {
                data['tb' + i + '_match'] = document.getElementById('gTb' + i + 'Match').value.trim();
                var winner = (document.getElementById('gTb' + i + 'Winner') ? document.getElementById('gTb' + i + 'Winner').value : '').trim();
                var score = (document.getElementById('gTb' + i + 'Score') ? document.getElementById('gTb' + i + 'Score').value : '').trim();
                data['tb' + i + '_result'] = (winner + (score ? ' ' + score : '')).trim();
            }
            let result;
            if (id) {
                result = await updateDailyGuess(parseInt(id), data);
            } else {
                result = await createDailyGuess({ ...data, tournament_id: parseInt(tid) });
            }
            if (result.success) {
                closeModal('guessModal');
                showToast(id ? '竞猜已更新' : '竞猜已创建', 'success');
                adminLoadDailyGuessList();
            } else {
                showToast('操作失败: ' + (result.error || '未知错误'), 'error');
            }
        };

        window.adminEditGuess = async function(gid) {
            const tid = document.getElementById('guessTournamentSelect').value;
            if (!tid) return;
            const data = await getDailyGuesses(parseInt(tid));
            if (!Array.isArray(data)) return;
            const guess = data.find(g => g.id === gid);
            if (guess) adminOpenGuessModal(guess);
        };

        window.adminDeleteGuess = async function(gid) {
            if (!confirm('确定删除此竞猜？')) return;
            if (!confirm('再次确认：删除后不可恢复，确定删除？')) return;
            const result = await deleteDailyGuess(gid);
            if (result.success) { showToast('竞猜已删除', 'success'); adminLoadDailyGuessList(); }
            else { showToast('删除失败', 'error'); }
        };

        // ── Init: load tournaments panel ──
        adminLoadTournaments();
    }

    // ══════════════════════════════════════════════════════════════
    // Hash Router
    // ══════════════════════════════════════════════════════════════
    function router() {
        const hash = window.location.hash.replace(/^#\/?/, '');

        // Scroll to top on navigation
        window.scrollTo(0, 0);

        if (!hash || hash === '/') {
            renderHome();
        } else if (hash.match(/^tournament\/\d+$/)) {
            const tid = hash.split('/')[1];
            renderTournamentHome(tid);
        } else if (hash.match(/^tournament\/\d+\/players$/)) {
            const tid = hash.split('/')[1];
            renderPlayers(tid);
        } else if (hash.match(/^tournament\/\d+\/draw$/)) {
            const tid = hash.split('/')[1];
            renderDraw(tid);
        } else if (hash.match(/^tournament\/\d+\/schedule$/)) {
            const tid = hash.split('/')[1];
            renderSchedule(tid);
        } else if (hash.match(/^tournament\/\d+\/guesses$/)) {
            const tid = hash.split('/')[1];
            renderGuesses(tid);
        } else if (hash === 'admin') {
            renderAdmin();
        } else if (hash === 'login') {
            renderLogin();
        } else {
            app.innerHTML = '<div class="main-content"><section class="section"><div class="container"><div class="empty-state"><h3>页面未找到</h3><p>该页面不存在</p><a href="#/" class="btn btn-primary btn-sm">返回首页</a></div></div></section></div>';
        }
    }

    window.addEventListener('hashchange', router);
    // Initial route
    router();

    </script>
